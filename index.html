<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encounter Budget Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8ece8;
    --panel: #f6f8f5;
    --ink: #1b2a2f;
    --muted: #5b6b6e;
    --line: #c5cec8;
    --accent: #8c2f39;
    --accent-ink: #ffffff;
    --focus: #1f6f78;
    --display: "Alegreya", Georgia, "Times New Roman", serif;
    --body: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141c1f;
      --panel: #1c272b;
      --ink: #e6ece8;
      --muted: #9aaaad;
      --line: #33444a;
      --accent: #e08a92;
      --accent-ink: #1b1014;
      --focus: #6cc3cc;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--bg);
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.1;
    margin: 0 0 28px;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 340px);
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
  }
  .stack { display: grid; gap: 24px; }
  h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.35rem;
    margin: 0 0 14px;
  }
  label, legend { font-weight: 500; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { padding: 0; margin-bottom: 8px; }

  select, input[type="number"], button {
    font: inherit;
    color: inherit;
  }
  select, input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    min-height: 44px;
  }
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .member {
    display: grid;
    grid-template-columns: 1fr auto 44px;
    gap: 12px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .member:last-of-type { border-bottom: 0; }
  .member select { width: 92px; }
  .icon-btn {
    width: 44px; height: 44px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add {
    margin-top: 14px;
    min-height: 44px;
    padding: 8px 16px;
    border: 1px dashed var(--muted);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    font-weight: 500;
  }
  .add:hover { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--muted); margin: 0; }

  .segments {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .segments label {
    position: relative;
    text-align: center;
    padding: 10px 4px;
    cursor: pointer;
    border-left: 1px solid var(--line);
  }
  .segments label:first-child { border-left: 0; }
  .segments input {
    position: absolute;
    opacity: 0;
    inset: 0;
    cursor: pointer;
  }
  .segments label:has(input:checked) {
    background: var(--ink);
    color: var(--panel);
  }
  .segments label:has(input:focus-visible) {
    outline: 3px solid var(--focus);
    outline-offset: -3px;
  }
  @media (max-width: 420px) {
    .segments { grid-template-columns: repeat(2, 1fr); }
    .segments label:nth-child(3) { border-left: 0; }
    .segments label:nth-child(n+3) { border-top: 1px solid var(--line); }
  }

  .stepper { display: inline-flex; gap: 8px; align-items: center; }
  .stepper input { width: 80px; text-align: center; }
  .stepper .icon-btn { font-size: 1.2rem; }
  .gap { margin-top: 22px; }

  .results { position: sticky; top: 20px; }
  @media (max-width: 760px) { .results { position: static; } }
  .result + .result { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
  .result-label { color: var(--muted); margin: 0 0 2px; }
  .result-value {
    font-family: var(--display);
    font-weight: 800;
    font-size: 3.4rem;
    line-height: 1;
    color: var(--accent);
    margin: 0;
    font-variant-numeric: lining-nums tabular-nums;
  }
  .result-unit { font-size: 1.1rem; font-weight: 500; color: var(--muted); margin-left: 6px; font-family: var(--body); }
  @media (prefers-reduced-motion: no-preference) {
    .icon-btn, .add, .segments label { transition: border-color .15s, color .15s, background-color .15s; }
  }
</style>
</head>
<body>
<main>
  <h1>Encounter Budget Calculator</h1>

  <div class="layout">
    <div class="stack">
      <section aria-labelledby="party-h">
        <h2 id="party-h">Party</h2>
        <div id="party"></div>
        <button type="button" class="add" id="add">Add party member</button>
      </section>

      <section aria-labelledby="enc-h">
        <h2 id="enc-h">Encounter</h2>
        <fieldset>
          <legend>Difficulty</legend>
          <div class="segments" id="difficulty">
            <label><input type="radio" name="difficulty" value="easy"> Easy</label>
            <label><input type="radio" name="difficulty" value="medium" checked> Medium</label>
            <label><input type="radio" name="difficulty" value="hard"> Hard</label>
            <label><input type="radio" name="difficulty" value="deadly"> Deadly</label>
          </div>
        </fieldset>

        <div class="gap">
          <label for="monsters">Number of monsters</label><br>
          <div class="stepper" style="margin-top:8px">
            <button type="button" class="icon-btn" id="minus" aria-label="Fewer monsters">&minus;</button>
            <input type="number" id="monsters" min="1" max="99" step="1" value="1" inputmode="numeric">
            <button type="button" class="icon-btn" id="plus" aria-label="More monsters">+</button>
          </div>
        </div>
      </section>
    </div>

    <section class="results" aria-labelledby="res-h" aria-live="polite">
      <h2 id="res-h">Result</h2>
      <div class="result">
        <p class="result-label">Total monster XP budget</p>
        <p class="result-value"><span id="budget">&ndash;</span><span class="result-unit" id="budget-unit"></span></p>
      </div>
      <div class="result">
        <p class="result-label">Recommended maximum challenge rating</p>
        <p class="result-value" id="cr">&ndash;</p>
      </div>
    </section>
  </div>
</main>

<script>
(function () {
  // XP thresholds by character level: [easy, medium, hard, deadly]
  var XP = {
    1:[25,50,75,100], 2:[50,100,150,200], 3:[75,150,225,400], 4:[125,250,375,500],
    5:[250,500,750,1100], 6:[300,600,900,1400], 7:[350,750,1100,1700], 8:[450,900,1400,2100],
    9:[550,1100,1600,2400], 10:[600,1200,1900,2800], 11:[800,1600,2400,3600], 12:[1000,2000,3000,4500],
    13:[1100,2200,3400,5100], 14:[1250,2500,3800,5700], 15:[1400,2800,4300,6400], 16:[1600,3200,4800,7200],
    17:[2000,3900,5900,8800], 18:[2100,4200,6300,9500], 19:[2400,4900,7300,10900], 20:[2800,5700,8500,12700]
  };
  var DIFF = { easy:0, medium:1, hard:2, deadly:3 };

  function multiplier(n) {
    if (n <= 1) return 1;
    if (n === 2) return 1.5;
    if (n <= 6) return 2;
    if (n <= 10) return 2.5;
    if (n <= 14) return 3;
    return 4;
  }

  var party = [3, 3, 3, 3];
  var partyEl = document.getElementById("party");
  var monstersEl = document.getElementById("monsters");
  var budgetEl = document.getElementById("budget");
  var unitEl = document.getElementById("budget-unit");
  var crEl = document.getElementById("cr");

  try {
    var saved = JSON.parse(localStorage.getItem("encounter-calc") || "null");
    if (saved) {
      if (Array.isArray(saved.party)) {
        party = saved.party.filter(function (l) { return l >= 1 && l <= 20; });
      }
      if (saved.difficulty) {
        var r = document.querySelector('input[name="difficulty"][value="' + saved.difficulty + '"]');
        if (r) r.checked = true;
      }
      if (saved.monsters >= 1) monstersEl.value = saved.monsters;
    }
  } catch (e) {}

  function difficulty() {
    return document.querySelector('input[name="difficulty"]:checked').value;
  }
  function monsterCount() {
    var n = parseInt(monstersEl.value, 10);
    return isNaN(n) || n < 1 ? 1 : Math.min(n, 99);
  }

  function renderParty(focusIndex) {
    partyEl.innerHTML = "";
    if (!party.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No party members yet. Add one to see a budget.";
      partyEl.appendChild(p);
    }
    party.forEach(function (level, i) {
      var row = document.createElement("div");
      row.className = "member";

      var label = document.createElement("label");
      label.textContent = "Party member " + (i + 1) + " level";
      label.htmlFor = "lvl-" + i;

      var sel = document.createElement("select");
      sel.id = "lvl-" + i;
      for (var l = 1; l <= 20; l++) {
        var o = document.createElement("option");
        o.value = l; o.textContent = l;
        if (l === level) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", function () {
        party[i] = parseInt(sel.value, 10);
        update();
      });

      var rm = document.createElement("button");
      rm.type = "button";
      rm.className = "icon-btn";
      rm.innerHTML = "&times;";
      rm.setAttribute("aria-label", "Remove party member " + (i + 1));
      rm.addEventListener("click", function () {
        party.splice(i, 1);
        renderParty();
        update();
      });

      row.appendChild(label);
      row.appendChild(sel);
      row.appendChild(rm);
      partyEl.appendChild(row);
    });
    if (focusIndex != null) {
      var s = document.getElementById("lvl-" + focusIndex);
      if (s) s.focus();
    }
  }

  function update() {
    var d = DIFF[difficulty()];
    var count = monsterCount();

    try {
      localStorage.setItem("encounter-calc", JSON.stringify({
        party: party, difficulty: difficulty(), monsters: count
      }));
    } catch (e) {}

    if (!party.length) {
      budgetEl.textContent = "\u2013";
      unitEl.textContent = "";
      crEl.textContent = "\u2013";
      return;
    }

    var threshold = 0, levelSum = 0;
    party.forEach(function (l) { threshold += XP[l][d]; levelSum += l; });

    var budget = Math.floor(threshold / multiplier(count));
    var maxCR = Math.floor(levelSum / party.length);

    budgetEl.textContent = budget.toLocaleString();
    unitEl.textContent = "XP";
    crEl.textContent = maxCR;
  }

  document.getElementById("add").addEventListener("click", function () {
    party.push(party.length ? party[party.length - 1] : 1);
    renderParty(party.length - 1);
    update();
  });
  document.getElementById("minus").addEventListener("click", function () {
    monstersEl.value = Math.max(1, monsterCount() - 1);
    update();
  });
  document.getElementById("plus").addEventListener("click", function () {
    monstersEl.value = Math.min(99, monsterCount() + 1);
    update();
  });
  monstersEl.addEventListener("input", update);
  monstersEl.addEventListener("blur", function () { monstersEl.value = monsterCount(); update(); });
  document.getElementById("difficulty").addEventListener("change", update);

  renderParty();
  update();
})();
</script>
</body>
</html>
